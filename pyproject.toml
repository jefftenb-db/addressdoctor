[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "address-verify"
version = "0.1.0"
description = "Databricks-native replacement for Informatica Address Doctor (US)."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
databricks = [
    "databricks-sdk>=0.20",
    "databricks-vectorsearch>=0.40",
    "mlflow>=2.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
